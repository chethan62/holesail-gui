[package]
name = "holesail-gui"
version = "0.7.0"
description = "Desktop GUI for Holesail — share local ports and connect to P2P tunnels"
license = "MIT"
edition = "2021"
# floor_char_boundary (used in the event-log trim) stabilized in 1.91
rust-version = "1.91"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "holesail_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
local-ip-address = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native", "crypto-rust"] }
