# Weekly upstream canary.
#
# The app does not own its wire protocol: hyperdht and @holesail/hyper-cmd-lib-net
# do. A release pins versions that were tested; this workflow asks the other
# question — does the app still work against whatever upstream shipped *this*
# week — so drift is discovered by a Monday job instead of by a user's tunnel.
#
# Informational only, and structurally so: this workflow is never a dependency of
# a release job (it runs on a schedule or by hand), so a red run here cannot block
# anything. If it is red, the answer is a decision (pin harder, fix, or adopt),
# never an automatic block.
#
# It is NOT marked continue-on-error, and that is deliberate: a tolerated failure
# is also invisible to the report job's `if: failure()`, so a red canary would
# have failed silently with no issue opened (measured — the report job was
# skipped). A canary that cannot report is not a canary.
name: canary

on:
  schedule:
    # Mondays 06:00 UTC. GitHub disables scheduled workflows after 60 days of
    # repository inactivity — if the canary ever stops running, check that first.
    - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      hyperdht:
        description: hyperdht spec to test. Default latest; pin a version to prove the canary can go red.
        required: false
        default: latest
        type: string

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Latest upstream protocol deps
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # --no-save: the lockfile stays the release's business. The runner is
      # throwaway, so node_modules is the right place for "latest".
      # A dispatch input is untrusted by construction, so it is validated before
      # it reaches a command line — passed through env rather than interpolated,
      # so a quote in the value cannot become shell syntax, and matched against a
      # single-quoted allowlist. NOT a `case` pattern: `<` and `>` in a bracket
      # expression there are tokenised as redirections (syntax error), and
      # quoting the pattern instead makes it a literal comparison that matches
      # nothing — a guard that cannot fail. Measure it: dispatch this workflow
      # with hyperdht=$(id) and it must exit 2 with "refusing".
      - name: Move the protocol deps to latest
        env:
          HYPERDHT_SPEC: ${{ inputs.hyperdht }}
        run: |
          set -euo pipefail
          spec="${HYPERDHT_SPEC:-latest}"   # schedule runs have no inputs, so empty means latest
          if ! printf '%s' "$spec" | grep -qE '^[A-Za-z0-9.@^~*+=<>| -]+$'; then
            echo "refusing hyperdht spec: $spec" >&2
            exit 2
          fi
          npm install --no-save "hyperdht@$spec" @holesail/hyper-cmd-lib-net@latest

      - name: Record which versions are under test
        run: |
          # The run has to say what it tested, or a green result means nothing
          # six months from now.
          {
            echo "### Upstream canary versions"
            node -e "console.log('- hyperdht', require('hyperdht/package.json').version)"
            node -e "console.log('- @holesail/hyper-cmd-lib-net', require('@holesail/hyper-cmd-lib-net/package.json').version)"
            echo "- pinned (package.json): $(node -p "Object.entries(require('./package.json').dependencies).map(([k,v])=>k+'@'+v).join(', ')")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The payload is rebuilt because the bare bundle is where a broken upstream
      # shows up first — it is the runtime the shipped app actually uses.
      - name: Rebuild the payload against the new upstreams
        run: node scripts/prepare-resources.mjs --bare

      - name: Protocol E2E (node runtime)
        run: npm test

      - name: Protocol E2E (bare runtime)
        run: npm run test:bare

  report:
    name: Report a red canary
    needs: canary
    if: failure()
    runs-on: ubuntu-22.04
    steps:
      - name: Open or update the canary issue
        # GitHub-provided values only: schedule/dispatch triggers carry no
        # event payload, and each value is passed through env rather than
        # interpolated into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Search by title rather than by label: a label that does not exist yet
          # would make this step fail, and then the failure would be lost.
          TITLE='Upstream protocol canary failed'
          body=$(printf 'The weekly canary failed against the latest upstreams.\n\nRun: %s\n\nThis is informational — it gates nothing. Decide: pin, fix, or adopt.\n' "$RUN_URL")
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$TITLE\"" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
