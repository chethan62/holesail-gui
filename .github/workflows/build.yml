name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  test:
    name: Protocol E2E (real DHT tunnel)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, renderer + worker + test + scripts)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: npm test (node runtime)
        run: npm test
      # iroh is opt-in (TUNNEL_ENGINE=iroh) and CANNOT run under bare — its
      # napi prebuilds do not load there, which is why packaged builds ship
      # holesail — so the iroh suite runs on the node leg only. Without this
      # step every iroh assertion (including suite §20-22) was local-only.
      - name: npm run test:iroh (iroh engine)
        run: npm run test:iroh
      - name: npm run test:bare (bare runtime)
        run: npm run test:bare

  clippy:
    name: Rust checks (fmt, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: npm ci

      - name: Prepare resources (required by tauri build.rs)
        run: node scripts/prepare-resources.mjs --bare

      - name: Format (rustfmt --check)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Without this step the 28 Rust tests existed only as a pre-release gate
      # run by hand: nothing in CI executed them, so a regression could only be
      # caught by whoever remembered to run them (the same blind spot that left
      # the iroh suite unrun for its whole life).
      - name: Test (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ui-smoke:
    name: UI smoke (Xvfb + AT-SPI)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install deps (webkit, Xvfb, AT-SPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb dbus at-spi2-core python3-pyatspi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build debug binary with bare runtime
        run: |
          node scripts/prepare-resources.mjs --bare
          cargo build --manifest-path src-tauri/Cargo.toml

      - name: Launch under Xvfb and assert the a11y tree
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- bash -euo pipefail -c '
              export GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1
              ./src-tauri/target/debug/holesail-gui &
              APP_PID=$!
              PYTHONUNBUFFERED=1 python3 scripts/ci-ui-smoke.py --app-pid $APP_PID --timeout 120
              echo "--- single-instance diagnostics ---"
              ./src-tauri/target/debug/holesail-gui --instances | tee /tmp/instances.txt
              grep -q "single-instance owner" /tmp/instances.txt
              timeout 30 ./src-tauri/target/debug/holesail-gui 2>&1 | tee /tmp/second.txt || true
              grep -q "another instance is running" /tmp/second.txt
              kill $APP_PID 2>/dev/null || true
            '

  linux:
    name: Linux (deb / rpm / AppImage)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Cache linuxdeploy/appimagetool downloads (~/.cache/tauri)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/tauri
          key: tauri-cache-${{ runner.os }}-v1

      - name: Prepare resources + build bundles (retry transient bundler failures)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          node scripts/prepare-resources.mjs --bare
          # NO_STRIP avoids linuxdeploy's bundled strip choking on .relr.dyn;
          # APPIMAGE_EXTRACT_AND_RUN works without FUSE.
          # 'http status: 503' / 'Peer disconnected' while the bundlers
          # download tooling is a runner-side network flake; retry.
          for attempt in 1 2 3; do
            echo "build attempt $attempt"
            NO_STRIP=1 APPIMAGE_EXTRACT_AND_RUN=1 npx tauri build && exit 0
            sleep 10
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Verify the packaged workers boot (deb + AppImage payloads)
        run: |
          # The packaged worker runs under the bundled bare runtime, which has
          # no Node globals — a worker that reads `process` passes every Node
          # test and dies on load in an installed build. It did, exactly once,
          # and nothing caught it because no check ever BOOTED the artifact.
          # Unpack the deb and talk to its own worker with its own runtime.
          set -e
          ping_worker() {
            printf '{"id":1,"method":"ping","params":{}}\n' \
              | timeout 60 "$1" "$2" \
              | tee /tmp/ping.json
            grep -q '"result":"pong"' /tmp/ping.json
            echo "OK: $1 booted $2"
          }
          mkdir -p /tmp/deb && dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb /tmp/deb
          ping_worker /tmp/deb/usr/lib/holesail-gui/bare /tmp/deb/usr/lib/holesail-gui/service-worker.js

          # The AppImage is what the Linux updater installs, so check its payload
          # too (its worker must boot under the bare runtime it carries).
          APP=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            rm -rf /tmp/squashfs-root
            # --appimage-extract needs no FUSE, so a bare runner can do this
            (cd /tmp && "$APP" --appimage-extract >/dev/null 2>&1 || true)
            if [ -x /tmp/squashfs-root/usr/lib/holesail-gui/bare ]; then
              ping_worker /tmp/squashfs-root/usr/lib/holesail-gui/bare /tmp/squashfs-root/usr/lib/holesail-gui/service-worker.js
            else
              echo "AppImage built but its payload has no bare runtime — investigate"
              exit 1
            fi
          else
            echo "no AppImage built (bundler flake) — deb payload checked, AppImage skipped"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: holesail-gui-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows (msi / exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Cache WiX tools (MSI bundling downloads ~150MB; flaky on GH runners)
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\tauri
          key: wix-tools-${{ runner.os }}-v1

      - name: Prepare resources + build bundles (retry transient bundler failures)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          # --bare bundles the win32 bare runtime + .bare-ABI native addons
          # (tauri.windows.conf.json ships it as a resource), so installed
          # builds don't need end users to have Node.js at all.
          node scripts/prepare-resources.mjs --bare
          # 'io: Peer disconnected' at the MSI bundle step is a runner-side
          # network drop (2/3 runs on 2026-08-12); retry the whole build.
          for attempt in 1 2 3; do
            echo "build attempt $attempt"
            npx tauri build && exit 0
            sleep 10
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Verify the bundled runtime boots the worker
        shell: bash
        run: |
          # Same class of check as the Linux job's deb/AppImage payloads: the
          # packaged worker must boot under THIS platform's bundled bare runtime,
          # which has no Node globals — a worker that reads `process` passes
          # every Node test and then dies on a real install. Windows ships
          # bare.exe; no `timeout` wrapper because the shell here is git-bash and
          # the worker exits when its stdin closes.
          cd dist-resources
          RT=$(ls | grep -xE 'bare(\.exe)?' | head -1)
          printf '{"id":1,"method":"ping","params":{}}\n' \
            | ./"$RT" service-worker.js | tee /tmp/ping.json
          grep -q '"result":"pong"' /tmp/ping.json
          echo "OK: $RT booted the worker"

      - uses: actions/upload-artifact@v5
        with:
          name: holesail-gui-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS (app / dmg)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Prepare resources + build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc code sign (pseudo-identity "-"). Without ANY bundle signature
          # macOS reports a downloaded app as "damaged and can't be opened" —
          # a block a user cannot click past — because Apple Silicon requires a
          # signature for apps from the internet. Ad-hoc still shows the
          # unidentified-developer warning, which the user CAN allow, so it is
          # the difference between "installable with a warning" and "not
          # installable". A real Developer ID certificate (which would also need
          # notarization) is a spend-it-money decision, not a code change.
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          # --bare bundles the darwin bare runtime + .bare-ABI native addons
          # (tauri.macos.conf.json ships it as a resource), so installed
          # builds don't need end users to have Node.js at all.
          node scripts/prepare-resources.mjs --bare
          npx tauri build

      - name: Verify the .app is signed (ad-hoc counts, unsigned does not)
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          echo "app: $APP"
          if [ ! -e "$APP/Contents/_CodeSignature/CodeResources" ]; then
            echo "FAIL: the bundle has no signature — macOS will call this 'damaged'"
            exit 1
          fi
          # the nested runtime must be sealed by that signature, otherwise the
          # worker is unsigned code inside a signed app
          if ! grep -q 'Resources/bare' "$APP/Contents/_CodeSignature/CodeResources"; then
            echo "FAIL: Resources/bare is not covered by the app signature"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP" || exit 1
          echo "OK: signed (ad-hoc) and the bundled runtime is sealed by it"

      - name: Verify the bundled runtime boots the worker
        shell: bash
        run: |
          # See the Windows step: the mac bundle ships its own bare runtime, and
          # the worker must boot under it (macOS has no `timeout`; the worker
          # exits when its stdin closes).
          #
          # This check earned its keep before it ever passed: macOS had only ever
          # been "does the dmg build", and its first runs found the pinned bare
          # 1.31.0 unable to load ANY native addon on darwin-arm64 (every
          # `require` of a .bare addon = SIGSEGV, so the worker died on startup
          # and no mac user could tunnel). Keep it, and keep it strict.
          cd dist-resources
          echo "arch: $(uname -m) — $(./bare --version 2>&1)"
          echo "runtime: $(file -b ./bare 2>/dev/null || echo 'file unavailable')"
          printf 'console.log("hello from bare")\n' > /tmp/hello.js
          ./bare /tmp/hello.js
          RT=$(ls | grep -xE 'bare(\.exe)?' | head -1)
          printf '{"id":1,"method":"ping","params":{}}\n' \
            | ./"$RT" service-worker.js > /tmp/ping.json 2>/tmp/worker-err.txt
          status=$?
          echo "worker exit=$status"
          # Explicit, not `set -e`: the ping IS the assertion. An earlier
          # revision ran the diagnostic probes under `set +e` and then let a
          # failing `grep -q` fall through, so it printed OK over a worker that
          # had segfaulted — a check that can only report success is worse than
          # no check, which is why both streams are dumped and the exit is 1.
          if [ "$status" -ne 0 ] || ! grep -q '"result":"pong"' /tmp/ping.json; then
            echo "FAIL: the bundled runtime did not boot the worker"
            echo "--- stdout ---"; cat /tmp/ping.json
            echo "--- stderr ---"; tail -30 /tmp/worker-err.txt
            exit 1
          fi
          echo "OK: $RT booted the worker"

      - uses: actions/upload-artifact@v5
        with:
          name: holesail-gui-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          # The action's default packages are `tools platform-tools`, and
          # google no longer publishes the legacy standalone `tools`
          # package — the step dies with
          # `Warning: Failed to find package 'tools'` + exit 1 before
          # anything else runs (hit 2026-09-17; it had worked earlier the
          # same day, so this is upstream repo drift, not our code).
          # platform-tools is all we want here; the next step installs
          # platforms/build-tools/NDK explicitly.
          packages: 'platform-tools'

      - name: Accept licenses + install platform/build-tools/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - run: npm ci

      - name: Generate Android project
        run: npx tauri android init --ci --skip-targets-install
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Prepare bare-runtime worker bundle (android-arm64)
        run: node scripts/prepare-resources.mjs --bare --target android-arm64 --out dist-resources-android

      - name: Wire bundle into APK assets (Kotlin extractor)
        run: node scripts/android-glue.mjs

      - name: Build debug APK
        run: npx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          # single-use gradle: avoids daemon OOM crashes when the Rust
          # cross-compile + kotlin daemon compete for memory on the runner
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

      - name: Verify the APK bundles a usable worker + runtime
        run: |
          # Android is the one platform whose runtime cannot be booted in CI (no
          # emulator), so assert the two things that ARE checkable, both learned
          # the hard way on macOS: the worker files made it into the APK, and the
          # bundled runtime still EXPORTS the addon ABI symbols. Stripping those
          # is fatal on Mach-O and harmless on ELF — a property to assert, never
          # to assume (this is the same test that failed for darwin).
          APK=$(find src-tauri/gen/android -name '*.apk' | head -1)
          echo "apk: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -q 'assets/bare/service-worker.js' \
            || { echo "FAIL: worker entry not in the APK"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/bare/worker/engine/index.js' \
            || { echo "FAIL: worker modules not in the APK"; exit 1; }
          unzip -o -q "$APK" 'lib/arm64-v8a/libholesail_bare.so' -d /tmp/apkx
          nm -D --defined-only /tmp/apkx/lib/arm64-v8a/libholesail_bare.so \
            | grep -q bare_addon_load_dynamic \
            || { echo "FAIL: the bundled runtime does not export the addon ABI"; exit 1; }
          echo "OK: worker bundled, runtime exports the addon ABI"

      - uses: actions/upload-artifact@v5
        with:
          name: holesail-gui-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  flatpak:
    name: Flatpak (io.holesail.gui)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies + flatpak tooling + GNOME runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      - run: npm ci

      - name: Build release binary + flatpak bundle (retry transient failures)
        run: |
          set +e
          node scripts/prepare-resources.mjs --bare
          (cd dist-resources && tar -cf node_modules.tar node_modules)
          cargo build --release --manifest-path src-tauri/Cargo.toml
          for attempt in 1 2 3; do
            echo "flatpak build attempt $attempt"
            cd packaging/flatpak && flatpak-builder --user --force-clean \
              --disable-rofiles-fuse build-dir io.holesail.gui.yml && exit 0
            cd ../..
            sleep 10
          done
          echo "flatpak build failed after 3 attempts"
          exit 1

      - name: Verify the installed flatpak payload boots its worker
        run: |
          # The flatpak manifest lists what it installs BY HAND, and that list
          # drifted once: `worker/*.js` missed worker/engine/, so the worker died
          # at startup for flatpak users while every other platform was fine.
          # Boot the worker from the tree the manifest actually produced.
          APP=packaging/flatpak/build-dir/files/lib/holesail-gui
          ls "$APP"
          printf '{"id":1,"method":"ping","params":{}}\n' \
            | "$APP/bare" "$APP/service-worker.js" > /tmp/ping.json 2>/tmp/worker-err.txt
          status=$?
          echo "worker exit=$status"
          if [ "$status" -ne 0 ] || ! grep -q '"result":"pong"' /tmp/ping.json; then
            echo "FAIL: the installed flatpak payload cannot boot its worker"
            echo "--- stdout ---"; cat /tmp/ping.json
            echo "--- stderr ---"; tail -20 /tmp/worker-err.txt
            exit 1
          fi
          echo "OK: flatpak payload booted its worker"

      - name: Export bundle artifact
        run: |
          cd packaging/flatpak
          flatpak build-export --no-update-summary /tmp/hg-repo build-dir
          flatpak build-update-repo /tmp/hg-repo
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            /tmp/hg-repo holesail-gui.flatpak io.holesail.gui

      - uses: actions/upload-artifact@v5
        with:
          name: holesail-gui-flatpak
          path: packaging/flatpak/holesail-gui.flatpak

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # --generate-notes diffs commits between tags
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # update-manifest.mjs shells out to `npx tauri signer sign` — the CLI
      # must exist. Without npm ci this fails with "could not determine
      # executable to run" (the Aug-10 release never hit it: no signing
      # secrets then, so the manifest step was skipped).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sign artifacts + write update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \
            -o -name '*.flatpak' \) \
            -exec cp {} /tmp/release-assets/ \;
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/release-key
            node scripts/update-manifest.mjs /tmp/release-assets "$GITHUB_REF_NAME" \
              --key /tmp/release-key
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FILES=$(find /tmp/release-assets -type f | sort)
          [ -n "$FILES" ] || { echo "no artifacts found"; exit 1; }
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
