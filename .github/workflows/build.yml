name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  test:
    name: Protocol E2E (real DHT tunnel)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm test (node runtime)
        run: npm test
      - name: npm run test:bare (bare runtime)
        run: npm run test:bare

  linux:
    name: Linux (deb / rpm / AppImage)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Prepare resources + build bundles
        run: |
          node scripts/prepare-resources.mjs --bare
          # NO_STRIP avoids linuxdeploy's bundled strip choking on .relr.dyn;
          # APPIMAGE_EXTRACT_AND_RUN works without FUSE
          NO_STRIP=1 APPIMAGE_EXTRACT_AND_RUN=1 npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: holesail-gui-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows (msi / exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Prepare resources + build bundles
        shell: bash
        run: |
          node scripts/prepare-resources.mjs
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: holesail-gui-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Accept licenses + install platform/build-tools/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - run: npm ci

      - name: Generate Android project
        run: npx tauri android init --ci --skip-targets-install
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Prepare bare-runtime worker bundle (android-arm64)
        run: node scripts/prepare-resources.mjs --bare --target android-arm64 --out dist-resources-android

      - name: Wire bundle into APK assets (Kotlin extractor)
        run: node scripts/android-glue.mjs

      - name: Build debug APK
        run: npx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          # single-use gradle: avoids daemon OOM crashes when the Rust
          # cross-compile + kotlin daemon compete for memory on the runner
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

      - uses: actions/upload-artifact@v4
        with:
          name: holesail-gui-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FILES=$(find artifacts -type f -name '*.deb' -o -type f -name '*.rpm' \
            -o -type f -name '*.AppImage' -o -type f -name '*.msi' \
            -o -type f -name '*.exe' -o -type f -name '*.apk' | sort)
          [ -n "$FILES" ] || { echo "no artifacts found"; exit 1; }
          gh release create "$GITHUB_REF_NAME" $FILES \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
