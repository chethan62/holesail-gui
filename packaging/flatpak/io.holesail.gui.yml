# io.holesail.gui — Flatpak manifest (Tauri v2).
# Build: ./build.sh  (requires flatpak + flatpak-builder + the GNOME runtimes)
#
# WebKitGTK 4.1 ships inside the GNOME platform, so no SDK extension is
# needed (the freedesktop webkit2gtk-4.1 extension does not exist on
# flathub).

app-id: io.holesail.gui
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: holesail-gui

finish-args:
  # P2P tunnel needs outbound + inbound UDP/TCP on the DHT
  - --share=network
  # display — x11 explicitly (fallback-x11 alone lets GTK pick Wayland and
  # fail silently in headless/remote contexts); wayland for native sessions
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  # avoid GPU-rendering glitches in the webkit webview (NVIDIA)
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  # write access for app config (saved tunnels / recents / event log)
  - --persist=.config/io.holesail.gui
  # single-instance plugin (DBus service; id io.holesail.gui -> io_holesail_gui)
  - --own-name=org.io_holesail_gui.SingleInstance
  - --talk-name=org.io_holesail_gui.SingleInstance
  # tray icon (libayatana-appindicator): StatusNotifierWatcher + the socket
  # dir where the tray image is written (official Tauri flatpak guidance)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create

modules:
  # Tray-icon support: the GNOME runtime does NOT ship libayatana-appindicator3,
  # and the app panics at startup without it (verified 2026-08-15: "Failed to
  # load ayatana-appindicator3 or appindicator3 dynamic library" -> panic in
  # libappindicator-sys). Use the canonical flathub shared-modules recipe
  # (intltool -> libdbusmenu -> ayatana-ido -> libayatana-indicator ->
  # libayatana-appindicator 0.5.94), which handles the full dep chain.
  - name: intltool
    cleanup: ["*"]
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        mirror-urls:
          - https://sources.suse.com/SUSE:SLE-15-SP7:Update:BCI/000product/ca527df4d03bf96a67854a8ed2f0c64b/INCLUDED/SUSE:SLE-15-SP6:GA::intltool::45f77273c3f2ef792fa697b444183beb/intltool-0.51.0.tar.gz
          - https://mirror-hk.koddos.net/lfs/lfs-packages/12.0/intltool-0.51.0.tar.gz
          - https://gstreamer.freedesktop.org/src/mirror/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: patch
        path: shared-modules/intltool/intltool-perl5.26-regex-fixes.patch
  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
    cleanup: ["*.la", "/include", "/lib/pkgconfig", "/libexec", "/share/doc", "/share/gtk-doc"]
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        mirror-urls:
          - https://sources.suse.com/SUSE:SLFO:Main:Build/libdbusmenu/a5b3e4717f09f90f9cd5568a5f933e8d/libdbusmenu-16.04.0.tar.gz
          - https://mirror.math.princeton.edu/pub/frugalware/frugalware-2.1/source/xlib/libdbusmenu/libdbusmenu-16.04.0.tar.gz
          - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
      - type: patch
        path: shared-modules/libayatana-appindicator/0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch
  - name: ayatana-ido
    buildsystem: cmake-ninja
    # NOTE: NO cleanup of /include or /lib/pkgconfig — libayatana-indicator
    # compiles against BOTH the ido headers (libayatana-ido.h, ...) and the
    # pc file, and flatpak runs each module's cleanup before the next module
    # builds. Deleting either breaks the chain (both failed in CI).
    config-opts:
      - -DENABLE_INTROSPECTION=OFF
    # ayatana-ido 0.10.4's cmake DOES install a .pc — but to
    # /app/lib64/pkgconfig, which the next module's pkg-config doesn't
    # search on this distro (it looks in /app/lib/pkgconfig). Mirror it
    # into lib/pkgconfig, AND install the headers explicitly from the
    # source tree (cmake's header install varies by version; CI failed
    # with 'libayatana-ido.h: No such file' while local builds passed).
    build-commands:
      - |
        cmake --install . >/dev/null
        # Headers: ayatana-ido 0.10.4 has NO cmake header install rule —
        # they live in src/*.h and must be installed into the
        # include/libayatana-ido3-0.4/libayatana-ido/ layout that
        # libayatana-indicator's #include <libayatana-ido/...> expects.
        mkdir -p /app/include/libayatana-ido3-0.4/libayatana-ido
        cp src/*.h /app/include/libayatana-ido3-0.4/libayatana-ido/ 2>/dev/null || true
        # Mirror the .so and .pc from lib64 into lib — the runner's
        # toolchain links against /app/lib while ayatana-ido's cmake
        # installs to /app/lib64 (CI: 'cannot find -layatana-ido3-0.4').
        mkdir -p /app/lib
        cp /app/lib64/libayatana-ido3-0.4.so* /app/lib/ 2>/dev/null || true
        install -Dm644 /app/lib64/pkgconfig/libayatana-ido3-0.4.pc /app/lib/pkgconfig/libayatana-ido3-0.4.pc 2>/dev/null || \
        install -Dm644 /app/lib/pkgconfig/libayatana-ido3-0.4.pc /app/lib64/pkgconfig/libayatana-ido3-0.4.pc 2>/dev/null || true
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4
        commit: f968079b09e2310fefc3fc307359025f1c74b3eb
      - type: patch
        path: shared-modules/libayatana-appindicator/0001-Make-introspection-configurable.patch
  - name: libayatana-indicator
    buildsystem: cmake-ninja
    cleanup: ["/include", "/lib/pkgconfig", "/libexec", "/share"]
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.4
        commit: 611bb384b73fa6311777ba4c41381a06f5b99dad
  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    cleanup: ["/include", "/lib/pkgconfig"]
    config-opts:
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: 0.5.94
        commit: 31e8bb083b307e1cc96af4874a94707727bd1e79
  - name: holesail-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 holesail-gui /app/lib/holesail-gui/holesail-gui
      - install -Dm755 bare /app/lib/holesail-gui/bare
      - install -Dm644 service-worker.js /app/lib/holesail-gui/service-worker.js
      - tar -xf node_modules.tar -C /app/lib/holesail-gui/
      - install -Dm755 holesail-gui /app/bin/holesail-gui
      - install -Dm644 holesail-gui.desktop /app/share/applications/io.holesail.gui.desktop
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/io.holesail.gui.png
    sources:
      - type: file
        path: ../../src-tauri/target/release/holesail-gui
      - type: file
        path: ../../dist-resources/bare
      - type: file
        path: ../../dist-resources/service-worker.js
      - type: file
        path: ../../dist-resources/node_modules.tar
      - type: file
        path: ../arch/holesail-gui.desktop
      - type: file
        path: ../../src-tauri/icons/128x128.png
