# io.holesail.gui — Flatpak manifest (Tauri v2).
# Build: ./build.sh  (requires flatpak + flatpak-builder + the GNOME runtimes)
#
# WebKitGTK 4.1 ships inside the GNOME platform, so no SDK extension is
# needed (the freedesktop webkit2gtk-4.1 extension does not exist on
# flathub).

app-id: io.holesail.gui
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: holesail-gui

finish-args:
  # P2P tunnel needs outbound + inbound UDP/TCP on the DHT
  - --share=network
  # display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # avoid GPU-rendering glitches in the webkit webview (NVIDIA)
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  # write access for webview storage (localStorage for recent keys)
  - --persist=.local/share/holesail-gui
  # single-instance plugin (DBus service; id io.holesail.gui -> io_holesail_gui)
  - --own-name=org.io_holesail_gui.SingleInstance
  - --talk-name=org.io_holesail_gui.SingleInstance

modules:
  - name: holesail-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 holesail-gui /app/lib/holesail-gui/holesail-gui
      - install -Dm755 bare /app/lib/holesail-gui/bare
      - install -Dm644 service-worker.js /app/lib/holesail-gui/service-worker.js
      - tar -xf node_modules.tar -C /app/lib/holesail-gui/
      - install -Dm755 holesail-gui /app/bin/holesail-gui
      - install -Dm644 holesail-gui.desktop /app/share/applications/io.holesail.gui.desktop
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/io.holesail.gui.png
    sources:
      - type: file
        path: ../../src-tauri/target/release/holesail-gui
      - type: file
        path: ../../dist-resources/bare
      - type: file
        path: ../../dist-resources/service-worker.js
      - type: file
        path: ../../dist-resources/node_modules.tar
      - type: file
        path: ../arch/holesail-gui.desktop
      - type: file
        path: ../../src-tauri/icons/128x128.png
